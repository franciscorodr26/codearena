# Judge0 configuration for docker-compose.judge0.yml.
# Change both passwords before starting. Everything else can stay.
REDIS_PASSWORD=change-me-redis
POSTGRES_PASSWORD=change-me-postgres
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
REDIS_HOST=judge0-redis
REDIS_PORT=6379
# Keep untrusted code from reaching the network or running too long.
ENABLE_NETWORK=false
CPU_TIME_LIMIT=3
MAX_CPU_TIME_LIMIT=5
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=15
MEMORY_LIMIT=256000
MAX_MEMORY_LIMIT=512000
MAX_QUEUE_SIZE=100
